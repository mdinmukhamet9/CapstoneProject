serial_number: j100-0001
version: 0
system:
  username: administrator
  hosts:
    - hostname: cpr-j100-0001
      ip: 192.168.131.1
  ros2:
    namespace: j100_0001
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
  extras:
    ros_parameters:
      linear.x.max_velocity: 2.0
      linear.x.min_velocity: -2.0
      linear.x.max_acceleration: 20.0
      linear.x.min_acceleration: -20.0
      angular.z.max_velocity: 4.0
      angular.z.min_velocity: -4.0
      angular.z.max_acceleration: 25.0
      angular.z.min_acceleration: -25.0
platform:
  attachments:
    - name: front_fender
      type: j100.fender
      model: default
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
    - name: rear_fender
      type: j100.fender
      model: default
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 3.1415]
      enabled: true
mounts:
  bracket:
    - name: horizontal_bracket
      parent: base_link
      xyz: [0.25, 0.0, 0.0] 
      rpy: [0.0, 0.0, 0.0] 
      model: horizontal
sensors:
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: true
      parent: bracket_0_mount  
      xyz: [0.0, 0.0, 0.0]     
      rpy: [0.0, 0.0, 0.0]    
      ros_parameters:
        urg_node:
          angle_min: -1.5707
          angle_max: 1.5707
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.15, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "0"
          enable_color: true
          rgb_camera.profile: 640,480,30
          enable_depth: true
          depth_module.profile: 640,480,30
          pointcloud.enable: true
          frame_id: "${namespace}/camera_color_optical_frame"  
